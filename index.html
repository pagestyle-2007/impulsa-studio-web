<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Videos creativos, contenido digital y estrategias para hacer destacar tu marca.">
  <title>Impulse Studio | Haz que tu marca destaque</title>
<style>
    :root {
      --paper: #f8f8f5;
      --white: #ffffff;
      --ink: #171815;
      --muted: #686b63;
      --green: #0a941b;
      --line: #dedfd8;
      --max: 1120px;
      --header-bg: #080908;
      --header-text: #e8eae5;
      --tile-1: #e3f2c9;
      --tile-2: #d9f4df;
      --tile-3: #f4f0b8;
      --tile-border: #cbd9c3;
    }

    [data-theme="dark"] {
      --paper: #121311;
      --white: #1a1c18;
      --ink: #f0f2ed;
      --muted: #a0a39b;
      --green: #26c934;
      --line: #2e332b;
      --header-bg: #080908;
      --header-text: #e8eae5;
      --tile-1: #1e2618;
      --tile-2: #18261e;
      --tile-3: #262418;
      --tile-border: #2e3828;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--paper); color: var(--ink); font-family: Inter, "Helvetica Neue", Arial, sans-serif; line-height: 1.55; transition: background 0.3s ease, color 0.3s ease; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(var(--max), 88%); margin-inline: auto; }
    
    header { background: var(--header-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--line); }
    nav { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .logo { display: inline-flex; align-items: center; flex: 0 0 auto; background: var(--header-bg); padding: 8px 0; }
    .logo img { display: block; width: 250px; max-width: 42vw; height: auto; object-fit: contain; }
    
    .menu-container { display: flex; align-items: center; gap: 20px; }
    .menu { display: flex; align-items: center; gap: 28px; color: var(--header-text); font-size: 13px; }
    .menu a:hover { color: var(--green); }
    
    .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 12px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 650; transition: background .2s, color .2s, border-color .2s; cursor: pointer; }
    .btn:hover { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-outline { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn-outline:hover { color: #fff; background: var(--green); border-color: var(--green); }

    /* Botón de Modo Oscuro / Claro y Hamburguesa */
    .theme-toggle { background: transparent; border: 1px solid var(--line); color: var(--header-text); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: border-color .2s; }
    .theme-toggle:hover { border-color: var(--green); }

    .hamburger { display: none; flex-direction: column; justify-content: space-between; width: 28px; height: 20px; background: transparent; border: none; cursor: pointer; z-index: 120; }
    .hamburger span { display: block; width: 100%; height: 2px; background: var(--header-text); transition: transform 0.3s ease, opacity 0.3s ease; }

    .hero { padding-top: clamp(70px, 10vw, 135px); padding-bottom: 80px; }
    .eyebrow { display: block; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase; }
    h1 { max-width: 980px; font-size: clamp(52px, 8.7vw, 108px); font-weight: 760; line-height: .94; letter-spacing: -.075em; margin: 24px 0; }
    h1 .accent { color: var(--green); }
    h1 .stroke { color: transparent; -webkit-text-stroke: 1.6px var(--ink); }
    .lead { color: var(--muted); font-size: clamp(16px, 1.8vw, 20px); max-width: 610px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .proof { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 28px; color: var(--muted); font-size: 12px; }
    .proof b { color: var(--ink); font-weight: 600; }
    
    /* Video adaptado sin recortes (9:16 con contain) */
    .video-frame { position: relative; margin-top: 64px; max-width: 440px; margin-inline: auto; border: 1px solid var(--line); background: var(--white); }
    .video-inner { overflow: hidden; background: #080908; display: flex; justify-content: center; position: relative; }
    .video-portada { width: 100%; max-width: 100%; height: auto; aspect-ratio: 9 / 16; object-fit: contain; display: block; margin-inline: auto; background: #080908; }
    
    .video-tag { position: absolute; top: 16px; left: 16px; background: var(--paper); color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 8px 10px; text-transform: uppercase; z-index: 2; }
    .sound-toggle { position: absolute; right: 16px; bottom: 16px; z-index: 3; border: 1px solid rgba(255,255,255,.65); background: rgba(8,9,8,.82); color: #fff; padding: 11px 14px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; backdrop-filter: blur(8px); }
    .sound-toggle:hover { background: var(--green); border-color: var(--green); }
    
    section { padding: 86px 0; }
    .section-head { max-width: 690px; margin-bottom: 34px; }
    h2 { font-size: clamp(40px, 5.5vw, 70px); font-weight: 720; line-height: .99; letter-spacing: -.065em; margin: 14px 0 20px; }
    .muted { color: var(--muted); max-width: 640px; }
    
    .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); }
    .card { padding: 28px 25px 28px 0; border-bottom: 1px solid var(--line); }
    .card + .card { padding-left: 25px; border-left: 1px solid var(--line); }
    .icon { color: var(--green); font-size: 22px; font-weight: 600; }
    .card h3 { margin: 20px 0 9px; font-size: 22px; font-weight: 750; letter-spacing: -.035em; }
    .card p { color: var(--muted); font-size: 14px; max-width: 310px; }
    
    .showcase { background: var(--white); border-block: 1px solid var(--line); }
